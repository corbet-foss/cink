[package]
name = "cink"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Handwritten signature image rendering for correspondence: validate, size, place, verify. Pixels, not signatures."
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cink"

documentation = "https://docs.rs/cink"
keywords = ["i18n", "correspondence", "locale"]
categories = ["internationalization", "text-processing"]

include = ["Cargo.toml", "Cargo.lock", "src/**", "tables/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE", "LICENSE.md", "LICENSES/**"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
